<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Treino</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#workout-container">Pular para os treinos</a>
  <div class="container">
    <header class="app-header">
      <div class="app-header__title">
        <h1>Meu Treino</h1>
        <p class="subtitle">Selecione um treino</p>
      </div>
    </header>

    <div class="controls-bar" role="region" aria-label="Controles de treino">
      <div class="workout-selector">
        <label class="control-label" for="workout-select">Treino</label>
        <select id="workout-select" data-role="workout-select">
                    <option value="T">Técnicas & Orientações</option>
                    <option value="H">Alongamento Pós Treino</option>
                    <option value="Z">Abdômen</option>
                    <option value="Y">Panturrilhas</option>
                    <option value="A">A - Peito / Ombro / Tríceps</option>
                    <option value="B">B - Inferiores Completo</option>
                    <option value="C">C - Dorsais / Bíceps / Deltoide Posterior</option>
                    <option value="D">D - Peitoral / Deltoide</option>
                    <option value="E">E - Quadríceps/Glúteo</option>
                    <option value="F">Pernas de Respeito I</option>
                    <option value="G">Pernas de Respeito II</option>
        </select>
      </div>
    </div>

    <main>
      <div id="workout-container" tabindex="-1"></div>
    </main>
  </div>

  <script src="workouts-data.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
